name: Release image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing protected Git tag (vMAJOR.MINOR.PATCH)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref_type == 'tag' && github.ref_name == inputs.version
    runs-on: ubuntu-latest
    concurrency:
      group: meeting-image-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci && npm test
        working-directory: server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/meeting-recorder"
          echo 'Publishing disabled: registry-side immutable tags and a fail-closed existence check are not verified.' >&2
          exit 1
          docker build -t "$image:$VERSION" server
          docker push "$image:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION")
          test -n "$digest"
          printf 'Commit: `%s`\n\nImage: `%s`\n\nCI: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$digest" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
