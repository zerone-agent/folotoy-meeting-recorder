name: Release image
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: meeting-image-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version and tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci && npm test
        working-directory: server
      - name: Release safety gate
        run: |
          echo 'Publishing disabled until Docker Hub and SWR immutable-version protection and fail-closed duplicate checks are verified.' >&2
          exit 1
