# Example HTTP-only vhost. Replace the hostname with the HTTPS service host.
# Keep the existing HTTPS vhost for every authenticated API.
server {
    listen 80;
    server_name meeting-recorder.example.com;

    location ~ "^/meeting-service/time-proof/[0-9a-f]{64}$" {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
        proxy_pass http://127.0.0.1:3443;
    }
    location / { return 404; }
}
