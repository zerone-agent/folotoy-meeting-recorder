services:
  meeting:
    image: zeroneai/meeting-recorder:v0.1.0
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3443:3443"
    env_file:
      - ./meeting.env
    environment:
      MEETING_HOST: 0.0.0.0
      MEETING_PORT: 3443
      MEETING_DATA_DIR: /var/lib/meeting
      MEETING_TLS_CERT: /run/meeting-tls/cert.pem
      MEETING_TLS_KEY: /run/meeting-tls/key.pem
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/meeting
      - type: bind
        source: ./tls
        target: /run/meeting-tls
        read_only: true
