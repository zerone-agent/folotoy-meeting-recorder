services:
  meeting:
    image: zeroneai/meeting-recorder:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3443:3443"
    env_file:
      - ./meeting.env
    environment:
      MEETING_HOST: 0.0.0.0
      MEETING_PORT: 3443
      MEETING_DATA_DIR: /var/lib/meeting
      MEETING_HTTP: "true"
    volumes:
      - meeting_data:/var/lib/meeting

volumes:
  meeting_data:
